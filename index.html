<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SAIYAN</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#06080a">
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MTIgNTEyIj48cmVjdCB3aWR0aD0iNTEyIiBoZWlnaHQ9IjUxMiIgZmlsbD0iIzA2MDgwYSIvPjxwYXRoIGQ9Ik0yNTYgNDBsNDAgMTEwIDEwMC03MC0zMCAxMjAgMTIwLTIwLTExMCAxMTAtNTAgMTQwLTYwLTEyMC02MCAxMjAtNTAtMTQwTDIyIDI0MGwxMjAgMjAtMzAtMTIwIDEwMCA3MHoiIGZpbGw9IiMzZGZmOGIiLz48L3N2Zz4K">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Barlow:wght@500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/*
  SAIYAN · sistema visual
  Concepto: scouter y cámara de gravedad. Negro y grafito de base, plata para texto
  secundario y UN solo color de energía, el verde eléctrico. Sin naranja.
  Las líneas finas separan; las tarjetas se reservan para lo que se opera (la serie).
*/
:root {
  --bg: #06080a;
  --surface: #0e1215;
  --surface-2: #161b1f;
  --line: #232a2f;
  --ink: #eef2f3;
  --silver: #c8d0d4;
  --silver-dim: #8a959b;
  --volt: #3dff8b;
  --volt-deep: #17a75a;
  --volt-ink: #021208;
  --volt-glow: rgba(61, 255, 139, 0.32);
  --danger: #ff4d5e;
  --font-display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', Impact, sans-serif;
  --font-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-data: 'JetBrains Mono', ui-monospace, 'Roboto Mono', Menlo, monospace;
  --gutter: 20px;
  --tabbar-h: 68px;
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}
html {
  background: var(--bg);
  -webkit-text-size-adjust: 100%;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-weight: 500;
  font-size: 18px;
  line-height: 1.4;
  padding-bottom: calc(var(--tabbar-h) + 24px + env(safe-area-inset-bottom, 0px));
  background-image:
    repeating-conic-gradient(from 0deg at 50% -12%, rgba(61, 255, 139, 0.04) 0 1.4deg, transparent 1.4deg 7deg),
    radial-gradient(ellipse 90% 40% at 50% -10%, rgba(61, 255, 139, 0.12), transparent 70%);
  background-repeat: no-repeat;
}

button,
input,
a {
  font: inherit;
  color: inherit;
  -webkit-tap-highlight-color: transparent;
}
button {
  cursor: pointer;
}
:focus-visible {
  outline: 3px solid var(--volt);
  outline-offset: 2px;
}
.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}
.muted {
  color: var(--silver-dim);
  margin: 0;
}

/* ---------- estructura ---------- */
.topbar,
#banner,
#view {
  max-width: 640px;
  margin: 0 auto;
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
}
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 18px;
  padding-bottom: 6px;
}
.wordmark {
  display: flex;
  align-items: center;
  gap: 10px;
  font: 800 italic 30px/1 var(--font-display);
  letter-spacing: 0.14em;
  text-transform: uppercase;
}
.wordmark::before {
  content: '';
  width: 30px;
  height: 32px;
  background: var(--volt);
  clip-path: polygon(50% 0, 60% 30%, 84% 6%, 77% 42%, 100% 34%, 74% 100%, 26% 100%, 0 34%, 23% 42%, 16% 6%, 40% 30%);
  filter: drop-shadow(0 0 8px var(--volt-glow));
}
.local-tag {
  font: 500 13px var(--font-data);
  color: var(--silver-dim);
  letter-spacing: 0.04em;
}
.local-tag::before {
  content: '●';
  color: var(--volt);
  margin-right: 6px;
}

.screen {
  padding-top: 18px;
  display: grid;
  gap: 20px;
}
.screen-title {
  margin: 0;
  font: 800 italic 44px/1 var(--font-display);
  letter-spacing: 0.03em;
  text-transform: uppercase;
}
.sec-title {
  margin: 10px 0 0;
  padding-top: 18px;
  border-top: 1px solid var(--line);
  font: 700 22px/1 var(--font-display);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--silver);
}
.eyebrow {
  margin: 0;
  font: 500 13px var(--font-data);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--volt);
}

/* ---------- navegación inferior ---------- */
.tabbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 20;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
  background: rgba(6, 8, 10, 0.96);
  border-top: 1px solid var(--line);
}
.tab {
  position: relative;
  display: grid;
  justify-items: center;
  align-content: center;
  gap: 3px;
  min-height: var(--tabbar-h);
  color: var(--silver-dim);
  text-decoration: none;
  min-width: 0;
  padding: 0 2px;
  white-space: nowrap;
  font: 700 13px/1 var(--font-display);
  letter-spacing: 0.03em;
  text-transform: uppercase;
}
.tab[aria-current='page'] {
  color: var(--volt);
}
.tab[aria-current='page']::before {
  content: '';
  position: absolute;
  top: -1px;
  left: 22%;
  right: 22%;
  height: 3px;
  background: var(--volt);
  box-shadow: 0 0 12px var(--volt);
}

/* ---------- avisos ---------- */
.banner {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px 16px;
  margin-top: 10px;
  padding: 12px 14px;
  background: var(--surface-2);
  border-left: 4px solid var(--volt);
  font-size: 16px;
}
.banner-link {
  color: var(--volt);
  font-weight: 600;
  text-underline-offset: 3px;
}
#toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom, 0px));
  z-index: 40;
  transform: translateX(-50%);
  max-width: min(92vw, 460px);
  padding: 12px 18px;
  background: var(--volt);
  color: var(--volt-ink);
  font-weight: 600;
  font-size: 16px;
  text-align: center;
}
#toast[hidden] {
  display: none;
}

/* Componentes de SAIYAN. Colores solo desde los tokens de main.css. */

/* ---------- botones ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 52px;
  padding: 10px 28px;
  text-align: center;
  border: 0;
  background: var(--surface-2);
  color: var(--ink);
  font: 700 20px/1 var(--font-display);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  text-decoration: none;
  clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
}
.btn:disabled {
  opacity: 0.5;
}
.btn-primary {
  background: var(--volt);
  color: var(--volt-ink);
}
.btn-quiet {
  background: var(--surface-2);
  color: var(--silver);
}
.btn-danger {
  background: var(--danger);
  color: #1a0004;
}
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 14px;
}
.block {
  display: grid;
  gap: 4px;
}
.warn-note {
  margin: 0 0 8px;
  padding: 12px 14px;
  background: var(--surface-2);
  border-left: 4px solid var(--danger);
  font-size: 16px;
}

/* ---------- inicio ---------- */
.hero {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  display: grid;
  grid-template-columns: 148px 1fr;
  align-items: center;
  gap: 18px;
  padding: 18px 8px 18px 4px;
}
.hero::before,
.hero::after {
  content: '';
  position: absolute;
  width: 22px;
  height: 22px;
  border: 0 solid var(--volt);
  pointer-events: none;
}
.hero::before {
  top: 0;
  left: 0;
  border-width: 3px 0 0 3px;
}
.hero::after {
  right: 0;
  bottom: 0;
  border-width: 0 3px 3px 0;
}
.ring {
  width: 100%;
  height: auto;
  display: block;
}
.ring-tick {
  stroke: var(--line);
  stroke-width: 2;
}
.ring-tick.on {
  stroke: var(--volt);
}
.ring-track {
  fill: none;
  stroke: var(--surface-2);
  stroke-width: 8;
}
.ring-fill {
  fill: none;
  stroke: var(--volt);
  stroke-width: 8;
  stroke-linecap: butt;
  filter: drop-shadow(0 0 6px var(--volt-glow));
}
.ring-cap {
  fill: var(--silver-dim);
  font: 500 11px var(--font-data);
  letter-spacing: 0.14em;
}
.ring-level {
  fill: var(--ink);
  font: 800 italic 44px var(--font-display);
}
.hero::marker { content: none; }
.hero > * { position: relative; z-index: 1; }
.hero::selection { background: transparent; }
.hero { background: linear-gradient(112deg, transparent 0 35%, rgba(210,255,0,.045) 35.2% 35.8%, transparent 36% 56%, rgba(210,255,0,.07) 56.2% 56.7%, transparent 57%); }
.hero-text::before { content: ""; position: absolute; z-index: -1; right: 2%; top: 12%; width: 42%; height: 76%; border-top: 1px solid var(--volt); border-bottom: 1px solid var(--volt); transform: skewX(-28deg); opacity: .32; pointer-events: none; }
.hero-text { position: relative; display: grid;
  gap: 4px;
  min-width: 0;
}
.hero-rank {
  margin: 0;
  font: 800 italic 28px/1.05 var(--font-display);
  text-transform: uppercase;
  letter-spacing: 0.02em;
}

.metrics {
  display: grid;
  grid-template-columns: 1fr 1fr;
  margin: 0;
  border-top: 1px solid var(--line);
}
.metric {
  padding: 16px 0;
  border-bottom: 1px solid var(--line);
  min-width: 0;
}
.metric:nth-child(odd) {
  padding-right: 14px;
  border-right: 1px solid var(--line);
}
.metric:nth-child(even) {
  padding-left: 18px;
}
.metric dt {
  font: 500 14px var(--font-data);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--silver-dim);
}
.metric dd {
  margin: 6px 0 0;
}
.metric-value {
  font: 700 40px/1 var(--font-display);
  font-variant-numeric: tabular-nums;
}
.metric-unit {
  font: 600 18px var(--font-display);
  color: var(--silver-dim);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.empty {
  display: grid;
  gap: 12px;
  justify-items: start;
  padding: 4px 0;
}
.empty h2 {
  margin: 0;
  font: 700 28px/1 var(--font-display);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

/* ---------- listas ---------- */
.rows {
  list-style: none;
  margin: 0;
  padding: 0;
}
.row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  padding: 13px 0;
  border-bottom: 1px solid var(--line);
}
.row-name {
  font-size: 19px;
}
.row-value {
  font: 700 24px var(--font-display);
  font-variant-numeric: tabular-nums;
  color: var(--silver);
}
.phases {
  list-style: none;
  margin: 0;
  padding: 0;
}
.phase {
  display: grid;
  grid-template-columns: 70px 1fr auto;
  gap: 12px;
  align-items: baseline;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
  font-size: 17px;
  color: var(--silver-dim);
}
.phase.ok {
  color: var(--ink);
}
.phase-n {
  font: 700 18px var(--font-display);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.phase-state {
  font: 500 13px var(--font-data);
  text-transform: uppercase;
}
.phase.ok .phase-state {
  color: var(--volt);
}

/* ---------- stats ---------- */
.chart-empty {
  width: 100%;
  height: auto;
  display: block;
}
.chart-empty .grid {
  stroke: var(--line);
  stroke-width: 1;
  stroke-dasharray: 3 5;
}
.chart-empty .axis {
  stroke: var(--silver-dim);
  stroke-width: 2;
}
.stat-muscle-groups { display: grid; gap: 18px; }
.stat-muscle-group { border-top: 1px solid var(--line); padding-top: 10px; }
.stat-muscle-title { margin: 0 0 4px; color: var(--volt); font: 800 italic 22px/1.1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; }
.stat-exercise-list { list-style: none; padding: 0; margin: 0; }
.stat-exercise-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.stat-exercise-name { min-width: 0; font-size: 16px; }
.stat-exercise-best { flex: 0 0 auto; color: var(--volt); font: 700 17px var(--font-data); text-align: right; }
.transformation-gallery { margin: 8px 0 20px; }
.transformation-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; }
.transformation-card { position: relative; min-width: 0; overflow: hidden; display: grid; grid-template-columns: 76px 1fr; align-items: center; gap: 6px; padding: 8px; background: linear-gradient(135deg,var(--surface),#090d10); border: 1px solid var(--line); }
.transformation-card.is-current { border-color: var(--volt); box-shadow: inset 0 0 18px var(--volt-glow); }
.transform-figure { width: 76px; height: 92px; overflow: visible; }
.figure-energy { fill: none; stroke: var(--volt); stroke-linecap: round; stroke-dasharray: 5 5; animation: energy-flow 3s linear infinite; }
.figure-body { fill: #b7c2c7; stroke: #f3fff8; stroke-width: 1.2; filter: drop-shadow(0 0 4px var(--volt-glow)); }
.figure-detail,.figure-spikes { fill: none; stroke: var(--volt); stroke-width: 2; stroke-linecap: round; }
.figure-halo { fill: none; stroke: var(--volt); stroke-width: 1.5; stroke-dasharray: 3 4; opacity: .8; }
.transform-figure-1 .figure-energy,.transform-figure-2 .figure-energy { stroke-width: 2; }
.transform-figure-3 .figure-energy,.transform-figure-4 .figure-energy { stroke-width: 2.8; filter: drop-shadow(0 0 3px var(--volt)); }
.transform-figure-5 .figure-energy,.transform-figure-6 .figure-energy,.transform-figure-7 .figure-energy { stroke-width: 3.2; filter: drop-shadow(0 0 5px var(--volt)); }
.transformation-card-text { display: grid; gap: 4px; min-width: 0; }
.transformation-card-text strong { font: 800 italic 17px/1 var(--font-display); text-transform: uppercase; overflow-wrap: anywhere; }
.transformation-card-text small { color: var(--silver-dim); font-size: 11px; line-height: 1.2; }
.current-transform-tag { color: var(--volt); font: 700 10px var(--font-data); letter-spacing: .12em; }
@keyframes energy-flow { to { stroke-dashoffset: -40; } }
@media (max-width:390px) { .transformation-card { grid-template-columns: 58px 1fr; padding: 6px; } .transform-figure { width: 58px; height: 82px; } .transformation-card-text strong { font-size: 15px; } .stat-exercise-best { font-size: 14px; } }

/* ---------- registro de series ---------- */
.sample-flag {
  margin: 0;
  padding: 8px 12px;
  background: var(--surface-2);
  border-left: 4px solid var(--silver-dim);
  font: 500 14px var(--font-data);
  color: var(--silver);
}
.exercise-name {
  margin: 4px 0 -8px;
  font: 800 italic 32px/1 var(--font-display);
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
.set-row {
  display: grid;
  gap: 16px;
  padding: 16px;
  background: var(--surface);
  border-left: 4px solid var(--silver-dim);
}
.set-row.is-done {
  border-left-color: var(--volt);
  background: linear-gradient(90deg, rgba(61, 255, 139, 0.1), var(--surface) 60%);
}
.set-head {
  display: flex;
  gap: 10px;
  align-items: center;
}
.set-tag {
  font: 700 20px var(--font-display);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.set-tag-alt {
  padding: 3px 10px;
  background: var(--surface-2);
  color: var(--volt);
  font-size: 15px;
}
.set-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 18px;
}
.field {
  display: grid;
  gap: 8px;
  align-content: start;
  min-width: 0;
}
.field-inline {
  grid-template-columns: auto 1fr;
  align-items: center;
}
.field-label {
  font: 500 14px var(--font-data);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--silver-dim);
}
.weight-other {
  font: 500 15px var(--font-data);
  color: var(--silver-dim);
}
.stepper {
  display: grid;
  grid-template-columns: 52px minmax(0, 1fr) 52px;
  align-items: center;
  gap: 6px;
}
.stepper-btn {
  height: 56px;
  border: 0;
  background: var(--surface-2);
  color: var(--ink);
  font: 700 34px/1 var(--font-display);
}
.stepper-btn:active {
  background: var(--volt);
  color: var(--volt-ink);
}
.stepper-value {
  text-align: center;
  font: 800 38px/1 var(--font-display);
  font-variant-numeric: tabular-nums;
}
.segmented {
  display: flex;
  gap: 4px;
}
.seg {
  flex: 1;
  min-height: 46px;
  padding: 0 10px;
  border: 0;
  background: var(--surface-2);
  color: var(--silver);
  font: 700 20px var(--font-display);
}
.seg[aria-checked='true'] {
  background: var(--volt);
  color: var(--volt-ink);
}
.set-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.set-volume {
  font: 500 15px var(--font-data);
  color: var(--silver);
}
.done-btn {
  width: 76px;
  height: 76px;
  padding: 0;
  display: grid;
  place-items: center;
  border: 0;
  background: transparent;
}
.done-btn .ball {
  width: 100%;
  height: 100%;
}

.clock {
  display: grid;
  gap: 8px;
  padding-top: 4px;
}
.clock-text {
  font: 800 italic 64px/1 var(--font-display);
  font-variant-numeric: tabular-nums;
  color: var(--volt);
  text-shadow: 0 0 18px var(--volt-glow);
}
.clock-bar {
  display: block;
  height: 6px;
  background: var(--surface-2);
}
.clock-fill {
  display: block;
  height: 100%;
  width: 100%;
  background: var(--volt);
}
.clock-presets {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.chip {
  min-height: 44px;
  padding: 0 16px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--silver);
  font: 500 16px var(--font-data);
}

/* ---------- diálogo ---------- */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: grid;
  align-items: end;
  background: rgba(0, 0, 0, 0.72);
  padding: 16px max(16px, env(safe-area-inset-left, 0px)) calc(16px + env(safe-area-inset-bottom, 0px));
}
.dialog {
  width: min(100%, 520px);
  margin: 0 auto;
  display: grid;
  gap: 12px;
  padding: 22px;
  background: var(--surface);
  border-top: 4px solid var(--volt);
}
.dialog h2 {
  margin: 0;
  font: 800 italic 30px/1 var(--font-display);
  text-transform: uppercase;
}
.dialog p {
  margin: 0;
  color: var(--silver);
}
.dialog-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: flex-end;
  margin-top: 6px;
}

@media (prefers-reduced-motion: no-preference) {
  .ring-fill {
    transition: stroke-dasharray 0.6s ease;
  }
  .done-btn,
  .set-row {
    transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
  }
}

/* ---------- Dragon Ball ---------- */
.ball {
  display: block;
}
.ball.lit {
  filter: drop-shadow(0 0 7px var(--volt-glow));
}
.radar-bg {
  fill: #07120c;
  stroke: none;
}
.radar-grid {
  fill: none;
  stroke: rgba(61, 255, 139, 0.28);
  stroke-width: 1;
}
.radar-sweep {
  transform-origin: 70px 70px;
}
.scouter {
  position: relative;
  display: grid;
  gap: 8px;
  padding: 16px 16px 16px 20px;
  background:
    repeating-linear-gradient(0deg, rgba(61, 255, 139, 0.05) 0 1px, transparent 1px 4px),
    linear-gradient(90deg, rgba(61, 255, 139, 0.14), rgba(61, 255, 139, 0.03));
  border-left: 4px solid var(--volt);
}
.scouter-read {
  margin: 0;
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 4px 8px;
}
.scouter-num {
  font: 800 italic 56px/1 var(--font-display);
  font-variant-numeric: tabular-nums;
  color: var(--volt);
  text-shadow: 0 0 16px var(--volt-glow);
}
.scouter-unit {
  font: 500 15px var(--font-data);
  color: var(--silver);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.meter {
  display: block;
  height: 8px;
  background: var(--surface-2);
}
.meter-fill {
  display: block;
  height: 100%;
  background: repeating-linear-gradient(90deg, var(--volt) 0 10px, var(--volt-deep) 10px 12px);
  box-shadow: 0 0 10px var(--volt-glow);
}
.scouter-note {
  margin: 0;
  font: 500 15px var(--font-data);
  color: var(--silver);
}
.scouter.over .scouter-note {
  color: var(--volt);
  font: 800 italic 26px/1 var(--font-display);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.balls-block {

}
.balls .ball {

}
.row.current {

}

.row.current .row-value {

}

@media (prefers-reduced-motion: no-preference) {
  .radar-sweep {
    animation: sweep 3.6s linear infinite;
  }
  .scouter.over .scouter-num {
    animation: pulse 1.4s ease-in-out infinite alternate;
  }
  @keyframes sweep {
    to {
      transform: rotate(360deg);
    }
  }
  @keyframes pulse {
    to {
      text-shadow: 0 0 30px var(--volt);
    }
  }
}

/* ---------- biblioteca ---------- */

}

    for (const route of ROUTES) {
      nav.append(
        h("a", { class: "tab", href: "#" + route.id, "data-route": route.id, html: route.icon + `<span>${route.label}</span>` })
      );
    }
  }
  function markActive(nav, id) {
    for (const a of nav.querySelectorAll("a")) {
      if (a.dataset.route === id) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    }
  }
  async function render6(ctx) {
    const route = routeFromHash();
    const token = ++renderToken;
    markActive(ctx.nav, route.id);
    const view = ctx.view;
    try {
      const mod = await route.load();
      if (token !== renderToken) return;
      clear(view);
      view.dataset.route = route.id;
      await mod.render(view, ctx);
    } catch (error) {
      if (token !== renderToken) return;
      clear(view);
      view.append(h("section", { class: "screen" }, h("h1", { class: "screen-title" }, "Algo fall\xF3"), h("p", { class: "muted" }, error.message || String(error))));
    }
    if (current !== route.id) window.scrollTo(0, 0);
    current = route.id;
  }
  function startRouter(ctx) {
    window.addEventListener("hashchange", () => render6(ctx));
    return render6(ctx);
  }

  // saiyan/js/app.js
  init_dom();
  init_exercises();
  var DATA_STORES = ["workouts", "cardio", "bodyLog", "recovery", "photos", "routines"];
  async function backupBanner(banner) {
    clear(banner);
    let records = 0;
    for (const name of DATA_STORES) records += await count(name);
    if (records === 0) return;
    const last = await getSetting("lastBackupAt");
    const stale = !last || daysSince(last) >= 7;
    if (!stale) return;
    const text = last ? `Tu \xFAltimo respaldo fue hace ${daysSince(last)} d\xEDas.` : "Todav\xEDa no has hecho un respaldo.";
    banner.append(
      h("div", { class: "banner", role: "status" }, h("span", null, text), h("a", { class: "banner-link", href: "#mas" }, "Respaldar ahora"))
    );
  }
  async function registerOffline() {
    if (!("serviceWorker" in navigator) || !/^https?:$/.test(location.protocol)) return;
    try {
      await navigator.serviceWorker.register("service-worker.js");
    } catch (_) {
    }
  }
  async function start() {
    const view = document.getElementById("view");
    const nav = document.getElementById("nav");
    const banner = document.getElementById("banner");
    renderTabbar(nav);
    try {
      await open();
    } catch (error) {
      clear(view);
      view.append(
        h("section", { class: "screen" }, h("h1", { class: "screen-title" }, "No se pudo abrir la base de datos"), h("p", { class: "muted" }, error.message))
      );
      return;
    }
    try {
      await seedIfNeeded();
    } catch (error) {
      window.__seedError = error && error.message ? error.message : String(error);
    }
    const ctx = { view, nav, banner, dbVersion: DB_VERSION, refreshBanner: () => backupBanner(banner) };
    await startRouter(ctx);
    backupBanner(banner);
    registerOffline();
  }
  start();
})();
</script>
